name: deploy-admin

# Build the two admin images, push them to GHCR, then SSH to the Oracle VM and roll out the
# panel stack. This is the sibling of deploy.yml, not a replacement for it: the Twitch bot keeps
# its own compose file, its own project name and its own tag-triggered pipeline, and nothing in
# this workflow reads, writes or triggers anything belonging to it.
#
# **Manual dispatch only — there is no `push: tags` here.** The bot is released by cutting a v*
# tag, because a tag is a version number the overlay can report. The panel has no such artifact:
# nothing in chat reads its version, so a tag would be a ceremony with no consumer, and
# tagging-to-release would put the panel on the same clock as the bot (a panel-only fix would
# either wait for the next bot release or force a bot version that describes a bot nobody
# changed). A button in the Actions tab is the whole release action.
#
# The VM is x86_64 (AMD EPYC), the same as the bot's, so linux/amd64 is the only platform worth
# building and arm64 is not carried over here. See deploy.yml for why QEMU is not an option.
on:
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  OWNER: luckyfoxcode

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # The tag below is `foxsphere-${{ matrix.name }}`, so these two matrix names are what
          # make the image names - foxsphere-admin-api and foxsphere-admin-web - the exact ones
          # docker-compose.admin.yml references. Change one and the compose file starts pulling
          # an image nothing publishes, which surfaces as `pull access denied`, not as a build
          # failure.
          - name: admin-api
            dockerfile: .docker/admin.Dockerfile
            # Named target. admin-web has none: its Dockerfile ends at the Caddy runner stage,
            # so a target would name a stage that does not exist and fail the build.
            target: runner
          - name: admin-web
            dockerfile: .docker/admin-web.Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build-args key at all, deliberately - not an empty one.
      #   The bot's version ARG (the one deploy.yml computes in "Compute bot version") is read by
      #   the overlay's web.Dockerfile and by nothing here. Passing an ARG a Dockerfile does not
      #   declare is a hard build failure, so it must not survive the copy.
      #   VITE_API_BASE_URL is the overlay's same-origin switch. The panel is same-origin by
      #   construction instead - Caddy serves it and proxies /api to admin-api - and apps/admin
      #   reads no build-time env var at all (vite.config.ts says so).
      # Both Dockerfiles also build without a real DATABASE_URL: admin-web never touches one, and
      # admin.Dockerfile declares a placeholder ARG default for its build stage.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/foxsphere-${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/foxsphere-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # packages:read is what makes the GHCR login below able to pull. Without it the VM can only
    # fetch images whose package is public - and CI creates every new package private, so these
    # two images would fail their first pull with `denied`.
    permissions:
      contents: read
      packages: read
    steps:
      - name: SSH deploy
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: GHCR_ACTOR,GHCR_TOKEN
          # Shorter than deploy.yml's script, and the difference is the whole point: there is
          # nothing to migrate and nothing to backfill here. apps/api never runs
          # `prisma migrate deploy` and never writes the legacy User / UserLottery tables; the
          # schema it reads is brought up to date by the bot's release, which owns the
          # migrations. Running either here would couple the panel's release to the bot's schema.
          script: |
            set -e
            # Authenticate with this run's short-lived token, so package visibility does not gate
            # the deploy. --password-stdin keeps it out of the VM's process list; the logout at
            # the end keeps no stale credential on disk.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            # ~/foxsphere holds docker-compose.admin.yml + the same real .env the bot stack uses
            # (never committed). `-f` is required: compose would otherwise auto-detect the bot's
            # compose.yaml and roll out the wrong project.
            cd ~/foxsphere
            # pull BEFORE up -d, and this is not optional tidiness. Both images are `:latest`
            # with no pull_policy, so a bare `up -d` starts what is already on disk: the
            # previous release, reported as a success. docker-compose.admin.yml says the same
            # thing in its own header, and this line is the dependency it warns about.
            docker compose -f docker-compose.admin.yml pull
            # --wait blocks on the healthchecks, so a crash-looping container fails the deploy
            # instead of passing silently. --remove-orphans is scoped by the project name
            # foxsphere-admin (from the compose file), so it cannot reach the bot's containers.
            docker compose -f docker-compose.admin.yml up -d --wait --wait-timeout 60 --remove-orphans
            docker image prune -f || true   # cosmetic; must not abort before the logout
            docker logout ghcr.io
