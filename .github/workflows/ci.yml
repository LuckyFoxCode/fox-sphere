name: ci

# The verification gate from AGENTS.md, run on every PR and on the two long-lived
# branches: type-checking, linting, the builds, the two generated-artifact drift
# checks, the unit tests, and the admin coverage threshold.
on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest

    # apps/bot-runtime's specs talk to a real Postgres - see
    # apps/bot-runtime/src/__tests__/helpers/test-db.ts. The name of that database is
    # not negotiable: assertTestDatabase refuses anything that does not end in `_test`,
    # so a `ci` database here would turn the gate red on the guard rather than on a bug.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: fox_user
          POSTGRES_PASSWORD: fox_password
          POSTGRES_DB: foxsphere_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # `config` (packages/backend-shared) throws on any missing variable, and almost
    # everything imports it transitively - openapi:dump included. These are throwaway
    # placeholders: only the bot-runtime specs use them for anything, and they only
    # reach the Postgres above. Nothing here connects to Twitch.
    env:
      DATABASE_URL: "postgresql://fox_user:fox_password@localhost:5432/foxsphere_test?schema=public"
      COMMAND_PREFIX: "!"
      ALLOWED_ORIGIN: "http://localhost:5173"
      ADMIN_TWITCH_USER_ID: "ci"
      TWITCH_USER_ID: "ci"
      TWITCH_BOT_ID: "ci"
      TWITCH_CLIENT_ID: "ci"
      TWITCH_CHANNEL_NAME: "ci"
      TWITCH_CLIENT_SECRET: "ci"
      TWITCH_STREAMER_ACCESS_TOKEN: "ci"
      TWITCH_STREAMER_REFRESH_TOKEN: "ci"
      TWITCH_BOT_ACCESS_TOKEN: "ci"
      TWITCH_BOT_REFRESH_TOKEN: "ci"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Prisma client is gitignored; nothing type-checks before it exists.
      - run: pnpm --filter @fox-sphere/db prisma:generate

      # packages/*/dist must exist before either app type-checks.
      - run: pnpm build:p

      - name: openapi.json matches the routes
        run: pnpm openapi:dump && git diff --exit-code apps/api/openapi.json

      - name: admin client matches openapi.json
        run: pnpm gen:api && git diff --exit-code apps/admin/src/api/generated

      - name: api - types and lint
        working-directory: apps/api
        run: |
          ./node_modules/.bin/tsc --noEmit
          ./node_modules/.bin/eslint .

      - name: bot-runtime - types and lint
        working-directory: apps/bot-runtime
        run: |
          ./node_modules/.bin/tsc --noEmit
          ./node_modules/.bin/eslint .

      - name: overlay - types and lint
        working-directory: apps/overlay
        run: |
          ./node_modules/.bin/vue-tsc --build
          ./node_modules/.bin/oxlint .
          ./node_modules/.bin/eslint .

      - name: admin - types and lint
        working-directory: apps/admin
        run: |
          ./node_modules/.bin/vue-tsc --build
          ./node_modules/.bin/oxlint .
          ./node_modules/.bin/eslint .

      - name: build
        run: pnpm build

      # The service starts empty. `deploy`, never `dev`: a wrong DATABASE_URL here would
      # otherwise reset the wrong database, and `resetDb()` truncates on sight.
      - name: migrate the test database
        run: pnpm --filter @fox-sphere/db prisma:migrate:deploy

      - name: test
        run: pnpm test

      # The 90% threshold lives in apps/admin/vitest.config.ts; a stack below it
      # fails here, on every PR and on pushes to main/dev.
      - name: admin - coverage
        working-directory: apps/admin
        run: ./node_modules/.bin/vitest run --coverage

  # All four deployed images must build from a PR too - a broken Dockerfile otherwise only
  # surfaces on main, after the merge, in the deploy job itself. Two stacks, so two release
  # workflows: bot-runtime + web ship by deploy.yml (tag-triggered), admin-api + admin-web by
  # deploy-admin.yml (manual dispatch). The trigger differs; the build shape below does not.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: bot-runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/bot-runtime.Dockerfile
          target: runner
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/web.Dockerfile
          push: false
          build-args: VITE_API_BASE_URL=
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The panel's pair. No build-args: admin-web reads none (the panel is same-origin through
      # Caddy's /api proxy, so it has no VITE_API_BASE_URL), and admin-api's build stage declares
      # a placeholder DATABASE_URL ARG default. deploy-admin.yml builds them the same way, only
      # with push: true.
      - name: admin-api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/admin.Dockerfile
          target: runner
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: admin-web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/admin-web.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
