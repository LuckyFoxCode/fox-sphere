name: deploy

# Build ARM64 images, push to GHCR, then SSH to the Oracle VM and roll out.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  OWNER: luckyfoxcode

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: bot-runtime
            dockerfile: .docker/bot-runtime.Dockerfile
            target: runner
          - name: web
            dockerfile: .docker/web.Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3 # emulate arm64 on x86 runners
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          # web overlay is same-origin (Option B) -> empty base URL.
          build-args: |
            VITE_API_BASE_URL=
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/foxsphere-${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/foxsphere-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # packages:read is what makes the GHCR login below able to pull. Without it the VM
    # can only fetch images whose package is public - and CI creates every new package
    # private, so a renamed image would fail its first pull with `denied`.
    permissions:
      contents: read
      packages: read
    steps:
      - name: SSH deploy
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: GHCR_ACTOR,GHCR_TOKEN
          script: |
            set -e
            # Authenticate to GHCR with this run's short-lived token, so visibility of the
            # package does not gate the deploy. --password-stdin keeps it out of the VM's
            # process list; the logout at the end keeps no stale credential on disk.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            # ~/foxsphere holds the deploy repo's compose.yaml + a real .env (never committed).
            # compose auto-detects compose.yaml and auto-loads .env for ${...} interpolation.
            cd ~/foxsphere
            docker compose pull
            # Run migrations before swapping the app (one-shot container).
            docker compose run --rm bot-runtime pnpm --filter @fox-sphere/db prisma:migrate:deploy
            # --remove-orphans: the service was renamed backend -> bot-runtime, so the
            # old container is an orphan now. Without this it keeps running alongside
            # the new one - two Twitch workers on the same channel, every chat command
            # and EventSub event handled twice.
            docker compose up -d --remove-orphans
            docker image prune -f
            docker logout ghcr.io
