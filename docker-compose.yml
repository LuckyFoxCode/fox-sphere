# Dev stack: bot-runtime HTTP (`:3000`) + postgres. The Twitch worker (bot) runs locally (`pnpm worker:t`); the admin backend (`api`) and `admin` frontend run locally too.
services:
  postgres:
    image: postgres:18-alpine
    container_name: foxsphere-postgres
    environment:
      POSTGRES_USER: fox_user
      POSTGRES_PASSWORD: fox_password
      POSTGRES_DB: foxsphere_db
    ports:
      - "5432:5432"
    volumes:
      # Bind mount (not a named volume): persistent service data lives in ./data/,
      # gitignored. One subdir per service — postgres now, room for redis/<cache> later.
      # PG18 mounts the cluster root here; data lands in ./data/postgres_data/18/.
      # Note: `docker compose down -v` does NOT clear a bind mount — rm ./data/* to wipe.
      - ./data/postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fox_user -d foxsphere_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - foxsphere-network

  bot-runtime:
    build:
      context: .
      dockerfile: .docker/bot-runtime.Dockerfile
      target: dev
    container_name: foxsphere-bot-runtime
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://fox_user:fox_password@postgres:5432/foxsphere_db?schema=public"
      NODE_ENV: development
    command: sh -c "pnpm --filter backend-shared build && pnpm --filter types build && pnpm --filter shared-schemas build && pnpm --filter bot-runtime dev:server"
    volumes:
      - ./apps/bot-runtime:/app/apps/bot-runtime
      - ./packages:/app/packages
      - bot_runtime_node_modules:/app/apps/bot-runtime/node_modules
      - backend_shared_node_modules:/app/packages/backend-shared/node_modules
      - shared_schemas_node_modules:/app/packages/shared-schemas/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - foxsphere-network

volumes:
  bot_runtime_node_modules:
  backend_shared_node_modules:
  shared_schemas_node_modules:

networks:
  foxsphere-network:
    driver: bridge
